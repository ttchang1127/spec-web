<!doctype html>
<html lang="zh-Hant">

<meta charset="utf-8">

<style>
  :root{ --bg:#f7f8fa; --card:#fff; --ink:#1c2330; --sub:#5b6472; --line:#e3e7ee;
    --accent:#2b6cb0; --ok:#2f855a; --warn:#c05621; --err:#c53030; --chip:#edf2f7;
    --onAccent:#fff; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#12151b; --card:#1b1f27; --ink:#e6e9ef;
    --sub:#9aa4b2; --line:#2a2f3a; --accent:#63b3ed; --ok:#68d391; --warn:#f6ad55; --err:#fc8181; --chip:#252b36;
    --onAccent:#12151b; } }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);margin:0 0 16px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);color:var(--onAccent);border-color:transparent}
  button.on{background:var(--accent);color:var(--onAccent);border-color:transparent}
  /* 選中態內的次要文字（如「159 章」）原固定用 --sub，壓在 accent 底上只有 1.11:1，等於看不見。
     不用 opacity 降階——實測要 ≥.90 才過 4.5:1，而 .90 與 1.0 肉眼幾乎無差，等於白加一個魔術數字。
     改為顏色給滿、靠既有的字級差（12.5px vs 15px）表示次要。淺色 5.42:1／深色 8.01:1。 */
  button.on .muted,button.primary .muted{color:var(--onAccent)}
  button:hover{filter:brightness(1.05)}
  .pill{background:var(--chip);border-radius:20px;padding:3px 12px;font-size:13px}
  .stat{display:flex;gap:14px;flex-wrap:wrap} .stat .box{background:var(--chip);border-radius:9px;padding:8px 14px;min-width:92px}
  .stat .box small{display:block;color:var(--sub);font-size:12px} .stat b{font-size:19px}
  table{border-collapse:collapse;width:100%;font-size:13.5px} .scroll{overflow-x:auto}
  th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{color:var(--sub);font-weight:600;white-space:nowrap}
  .code{font-family:ui-monospace,Menlo,monospace;background:var(--chip);border-radius:5px;padding:1px 6px;font-size:12.5px}
  .grp .h{font-weight:700;font-size:15px}
  .miss{color:var(--err);font-weight:600} .ok{color:var(--ok)} .warn{color:var(--warn)}
  .n{font-variant-numeric:tabular-nums;font-weight:700}
  .muted{color:var(--sub);font-size:12.5px}
  .tag{font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:600}
  .tag.y{background:rgba(56,161,105,.15);color:var(--ok)} .tag.n{background:rgba(197,48,48,.15);color:var(--err)}
  details.mat{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  details.mat>summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none}
  details.mat>summary::-webkit-details-marker{display:none}
  details.mat>summary::before{content:'▸ ';color:var(--sub)}
  details.mat[open]>summary::before{content:'▾ '}
  .plan h2{font-size:18px;border-bottom:2px solid var(--accent);padding-bottom:4px;margin:22px 0 10px}
  .plan h3{font-size:15px;margin:16px 0 6px} .plan h4{font-size:14px;margin:12px 0 4px;color:var(--accent)}
  .plan p{margin:6px 0;font-size:13.5px} .plan ul{margin:4px 0 4px 20px;font-size:13.5px} .plan li{margin:2px 0}
  .plan table{margin:6px 0} .plan th,.plan td{border:1px solid var(--line)}
  .foot{color:var(--sub);font-size:12px;margin-top:22px}
  details summary{cursor:pointer;color:var(--sub)}
.pk-src{font-size:15px;padding:8px 18px}
.pk-src.on{outline:2px solid var(--accent)}
#picker table{margin-top:6px}
#picker details>summary{cursor:pointer;padding:4px 0}
.ph{background:rgba(246,173,85,.22);border:1px dashed var(--warn);border-radius:4px;padding:0 5px;font-weight:600}
.tplnote{border-left:3px solid var(--line);padding:2px 0 2px 9px;margin:6px 0;color:var(--sub);font-size:13px}
.condbox{border:1px dashed var(--err);border-radius:6px;padding:8px 10px;margin:8px 0}
.genmiss{color:var(--warn);font-weight:600}
.pfilled{background:rgba(47,133,90,.16);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>監造試驗查核 / 計畫產生 <span class="pill">v1.0</span></h1>
  <p class="sub">上傳空白標單（.xls/.xlsx）→ 兩用：<b>試驗查核</b>（應辦組數＋漏編）｜<b>監造計畫產生</b>（完整九章草稿，可下載 .doc）。全程瀏覽器內處理，不上傳。</p>

  <div class="card">
    <div class="row">
      <label class="primary" style="padding:8px 14px;border-radius:8px;cursor:pointer">📄 上傳標單 .xls/.xlsx
        <input type="file" id="file" accept=".xls,.xlsx" style="display:none"></label>
      <button id="sampleBtn">▶ 載入範例標單</button>
      <span class="muted" id="src"></span>
    </div>
    <div class="row" style="margin-top:12px">
      <span class="muted">模式：</span>
      <button id="mCheck" class="on">🔍 試驗查核</button>
      <button id="mPick">🧩 選工項（無標單）</button>
      <button id="mPlan">📝 監造計畫產生（九章）</button>
      <button id="dl" style="display:none">⬇ 下載 .doc</button>
    </div>
    <details style="margin-top:12px"><summary>🏷 案件資料（填入後帶入計畫抬頭與第一章；可留空）</summary>
      <div class="row" style="margin-top:10px">
        <input id="pName" placeholder="工程名稱" style="flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)">

      <div class="row" style="margin-top:8px">

      </div>
      <div class="row" style="margin-top:8px;align-items:center">
        <label style="display:flex;align-items:center;gap:6px">🔴 契約金額

        <label style="display:flex;align-items:center;gap:6px"><input id="pMech" type="checkbox"> 含運轉類機電設備（增訂第六章）</label>
      </div>
      <div class="row" style="margin-top:8px;align-items:center">
        <label style="display:flex;align-items:center;gap:6px">廠商契約金額

  <div id="out"></div>
  <p class="foot">v1.0 ｜ 燃料 spec_data.js（由 <span class="code">spec_kb_export.py</span> 從施工規範知識庫編譯）｜ 靜態 client-side</p>
</div>

<script>
const D = window.SPEC_DATA;
let LAST=null, MODE='check';
// 規則來源列同時當作「載入了哪一版資料」的可視指標——

document.getElementById('meta').innerHTML =
  `工項 ${Object.keys(D.工項).length} 章碼｜試驗庫 ${D.meta.counts.試驗庫}｜材料頻率 ${Object.values(D.工項).filter(v=>v.材料頻率&&v.材料頻率.length).length} 章｜標單別名 ${D.meta.counts.別名}`

  + `（資料 ${D.meta.generated}）`;
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const wiName = t => String(t||'').replace(/^工項\s*/,'');

// ---- 常數塊（監造計畫製作綱要九章樣板；SSOT 見 KB 04 章樣板卡與九章骨架對照）----

function parseWB(wb){
  let items=[], tests=new Set();
  for(const sn of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false});
    const hi = aoa.findIndex(r=>r&&r.some(c=>/項\s*目|品名|說明/.test(c||''))&&r.some(c=>/編\s*碼/.test(c||'')));
    if(hi>=0 && !items.length){
      const hdr=aoa[hi].map(c=>String(c||''));
      const find=re=>hdr.findIndex(h=>re.test(h));
      const iN=find(/項\s*目|品名|說明/), iU=find(/單\s*位/), iQ=find(/數\s*量/), iC=find(/編\s*碼/);
      for(const r of aoa.slice(hi+1)){ if(!r) continue;
        // 章碼尾碼：台電為 5 碼＋AA（02551AA/02555AA/02556AA），單 A 為輸變電處版。
        // 不含尾碼時行為與原 /^(\d{5})/ 相同；與 spec_kb_export.py 之 CODE_RE 保持一致，
        // 否則台電標單會被截成 5 碼而查無工項、全數落入「未建工項」。
        const m=String(r[iC]||'').trim().match(/^(\d{5}A{0,2})/); const name=String(r[iN]||'').trim();
        if(m&&name){ const q=parseFloat(String(r[iQ]||'').replace(/[,，\s]/g,''));
          items.push({章碼:m[1],項目:name,單位:String(r[iU]||'').trim(),數量:isNaN(q)?null:q}); }
      }
    }
    if(/資源|統計/.test(sn)) for(const r of aoa){ if(!r) continue;
      for(const c of r){ const s=String(c||'').trim(); if(/試驗/.test(s)&&s.length>3) tests.add(s); } }
  }
  return {items, tests:[...tests]};
}
// 標單單位正規化。只合併「確為同一物理量」的寫法；
// 座/支/處/區間/廠牌等計數單位一律不互相合併（座≠處，語意不同）。
function normU(s){
  const x=String(s||'').trim().toLowerCase()
    .replace(/[\s()（）]/g,'')
    .replace(/²/g,'2').replace(/³/g,'3')
    .replace('㎡','m2').replace('㎥','m3');
  const SYN={'公尺':'m','米':'m','ｍ':'m','m':'m',
             '平方公尺':'m2','平方米':'m2','m2':'m2',
             '立方公尺':'m3','立方米':'m3','m3':'m3',
             '公噸':'t','噸':'t','ton':'t','t':'t',
             '公斤':'kg','kg':'kg'};
  return SYN[x]||x;
}
// 工項卡 → 其所有試驗頻率卡（schema v0.2 起為陣列）。
// 保留對舊格式（單一字串）的容錯，避免載到舊 spec_data.js 時整頁壞掉。
// 過濾掉試驗庫中不存在者（export 端另有懸空引用告警）。
function libsOf(wi){
  const raw = wi && wi.試驗頻率卡;
  const ids = Array.isArray(raw) ? raw : (raw ? [raw] : []);
  return ids.map(id=>[id, D.試驗庫[id]]).filter(x=>x[1]);
}
function calcN(machine,qty,unit){
  const m=machine||{}, u=normU(unit);
  // qty_unit：宣告本列規則所需之標單單位。**有宣告才檢查**，未宣告維持舊行為（向後相容）。
  // 未加此鍵前 per_unit 完全不驗單位：250「M」的管路項目會被「1 組/座」算成 250 組，
  // 數字是錯的卻不報錯。台電三章因基底單位異質（座/公尺/支/區間/廠牌）而特別明顯。
  if(m.qty_unit){
    const want=normU(m.qty_unit);
    if(!u)       return {n:null,note:'需以「'+m.qty_unit+'」為單位之數量'};
    if(want!==u) return {n:null,note:'規則單位為「'+m.qty_unit+'」，標單為「'+unit+'」，需換算'};
  }
  if(u==='m3'&&m.per_m3) return {n:Math.ceil(qty/m.per_m3),note:m.per_day_min?'另每日≥'+m.per_day_min+'（取大值）':''};
  if(u==='m2'&&m.per_m2) return {n:Math.ceil(qty/m.per_m2),note:''};
  if(u==='m2'&&m.per_m2_per_layer) return {n:Math.ceil(qty/m.per_m2_per_layer),note:'×分層數'};
  if(m.per_m2_per_layer) return {n:null,note:'每層每'+m.per_m2_per_layer+'m²（需面積×層數）'};
  // 階梯式門檻：未達 exempt_below 免驗；達門檻~tier_base 檢驗 1 次；超過 tier_base 每 tier_step 加 1 次
  // （桃園 02316/02317/02320/02610/02770 等表格常見型；舊鍵 per_*_after_first_* 僅存步長、
  //   遺失免驗門檻與基準值故只能提示，本鍵組參數完整因此可實算）
  if(m.tier_base && m.tier_step){
    const rule=normU(m.tier_unit);   // 與 qty_unit 共用同一套正規化
    const desc=(m.exempt_below?'<'+m.exempt_below+' 免驗；':'')+'≤'+m.tier_base+' 取 1 次、超過每 '+m.tier_step+' 加 1';
    // 規則單位與標單單位不符時不得計算（否則會把 m³ 數量套進 m² 規則）
    if(rule && u && rule!==u) return {n:null,note:desc+'（規則單位 '+m.tier_unit+'，標單為 '+unit+'，需換算）'};
    if(rule && !u) return {n:null,note:desc+'（需 '+m.tier_unit+' 數量）'};
    if(m.exempt_below && qty < m.exempt_below)
      return {n:0,note:'<'+m.exempt_below+' 免驗（憑合格證明）'};
    const n = qty <= m.tier_base ? 1 : 1 + Math.ceil((qty - m.tier_base)/m.tier_step);
    return {n,note:desc};
  }
  // 公路局：每 N 單位取樣（線性/門檻）＋免驗門檻＋抽組倍數＋餘數併批
  if(m.per_unit){
    if(m.exempt_below && qty < m.exempt_below)
      return {n:0,note:'<'+m.exempt_below+' 免驗（憑合格證明）'};
    const full=Math.floor(qty/m.per_unit), rem=qty%m.per_unit;
    let batches=full + (rem >= (m.remainder_min||1) ? 1 : 0);
    if(batches<1) batches=1;              // 達檢驗門檻後至少 1 批
    const n=batches*(m.samples_each||1);
    const note=(m.exempt_below?'≥'+m.exempt_below+' 起檢；':'')
      +'每'+m.per_unit+(m.samples_each?' 抽'+m.samples_each+'組':' 取1次')
      +(m.remainder_min?'（餘≥'+m.remainder_min+'另計）':'');
    return {n,note};
  }
  // 比例制。基底有兩種，靠有無宣告 qty_unit 區分：
  //  (a) 基底＝標單數量（如 01991 人孔調平取人孔座數 30%、16120 取線卷總數 5%）
  //      → 宣告 qty_unit；走到這裡代表函式開頭的單位檢查已通過，可直接實算。
  //  (b) 基底不在標單（如 03210 對銲續接數 25%、03231 原廠批總數 5%）
  //      → 不宣告 qty_unit，維持提示型 n:null。ratio_base 用來把基底名稱寫進註記，
  //        取代舊版寫死的「原廠取樣數量」——該措辭對 (b) 的續接數情形本身就是錯的。
  if(m.per_ratio){
    const base = m.ratio_base ? '（基底：'+m.ratio_base+'）' : '';
    if(m.qty_unit){
      if(m.exempt_below && qty < m.exempt_below)
        return {n:0,note:'<'+m.exempt_below+' 免驗（憑合格證明）'};
      let n=Math.ceil(qty*m.per_ratio/100);
      const floor=m.ratio_min||0;
      const note='抽驗比例 '+m.per_ratio+'%'+base+(floor&&n<floor?'，未達下限改取 '+floor:'');
      if(floor&&n<floor) n=floor;
      return {n,note};
    }
    return {n:null,note:'抽驗比例 '+m.per_ratio+'%，需先確認基數'
      +(m.ratio_base?'：'+m.ratio_base:'（基底非標單數量）')
      +(m.ratio_min?'；且至少 '+m.ratio_min:'')};
  }
  if(m.exempt_below) return {n:0,note:'<'+m.exempt_below+' 免驗（憑證明），達門檻另計'};
  if(m.per_batch) return {n:null,note:'每批×'+m.per_batch+'（需批數）'};
  if(m.per_truck) return {n:null,note:'每車'};
  if(m.per_source) return {n:null,note:'每料源'};
  if(m.per_lane_m) return {n:null,note:'每車道'+m.per_lane_m+'m'};
  if(m.per_pour) return {n:null,note:'每次澆置（依澆置次數）'};
  if(m.per_m_after_first_100) return {n:null,note:'分段：達門檻1次、超過每100m加1次'};
  if(m.per_piece_after_first_100) return {n:null,note:'分段：達門檻1次、超過每100塊加1次'};
  if(m.per_piece_after_first_200) return {n:null,note:'分段：達門檻1次、超過每200塊加1次'};
  return {n:null,note:''};
}
// SRCSEL：選定之規範源。null＝沿用扁平字典（桃園優先）＝原行為。
// 🔴 扁平字典遇同章碼是桃園優先，勾選公路局源時若仍查扁平字典會取到桃園那張卡，
//    而兩源同章碼數值嚴禁互借——那會產出錯誤的監造計畫且完全不報錯。
let SRCSEL=null;
function wiOf(code){ return (SRCSEL ? (D.工項_源[SRCSEL]||{}) : D.工項)[code]; }
function grouped(items){ const b={}; items.forEach(it=>{(b[it.章碼]=b[it.章碼]||[]).push(it);});
  return Object.keys(b).sort().map(c=>({code:c,wi:wiOf(c),rows:b[c]})); }

// ================= 試驗查核 =================
function renderCheck(){
  const {items,tests}=LAST;
  let 命中=0,未建=0,漏編=0,材料章=0,cards='',未建list=[];
  for(const {code,wi,rows} of grouped(items)){
    if(!wi){未建++;未建list.push(`<tr><td><span class="code">${code}</span></td><td>${rows.length}</td><td class="muted">${esc(rows[0].項目.slice(0,28))}</td></tr>`);continue;}
    命中++;
    const libs=libsOf(wi);
    const uC={};rows.forEach(r=>{if(r.單位)uC[r.單位]=(uC[r.單位]||0)+1;});
    const unit=Object.keys(uC).sort((a,b)=>uC[b]-uC[a])[0]||'';
    const qty=rows.filter(r=>r.單位===unit).reduce((s,r)=>s+(r.數量||0),0);
    // 一章可對多張試驗頻率卡 → 逐卡一張表，並標明來源卡名（單卡時不加標題以免多餘）。
    let 試驗table='';
    for(const [lid,lib] of libs){
      let body='';
      for(const t of lib.試驗項目){
        const c=calcN(t.機器,qty,unit);
        const nCell=c.n!=null?`<span class="n ok">${c.n}</span> 組`:`<span class="warn">${esc(c.note||'—')}</span>`;
        let tg='<span class="muted">—</span>';
        if(t.關鍵字&&t.關鍵字.length){const hit=tests.some(nm=>t.關鍵字.some(k=>nm.includes(k)));tg=hit?'<span class="tag y">已編列</span>':'<span class="tag n">⚠ 漏編</span>';if(!hit)漏編++;}
        body+=`<tr><td>${esc(t.項目)}</td><td>${esc(t.頻率)}</td><td>${nCell}</td><td>${tg}</td><td class="muted">${esc(t.依據)}</td></tr>`;
      }
      const cap = libs.length>1 ? `<div class="muted" style="margin:10px 0 4px">📕 ${esc(lid)}</div>` : '';
      試驗table += cap+`<table><tr><th>應辦試驗項目</th><th>頻率</th><th>應辦組數</th><th>標單編列</th><th>依據</th></tr>${body}</table>`;
    }
    const fam=code!==wi.chapter_code?`（家族→${wi.chapter_code}）`:'';
    // 材料頻率：來自工項卡 ② 表，屬參考資訊（無機器欄故不算組數、不比對漏編）
    const mats = wi.材料頻率 || [];
    if (mats.length) 材料章++;
    const 材料block = mats.length ? `<details class="mat"${試驗table?'':' open'}>
      <summary>📋 材料/試驗頻率（工項卡 ②）<span class="muted">　${mats.length} 項・參考用，不計組數</span></summary>
      <div class="scroll" style="margin-top:8px"><table>
        <tr><th>項目</th><th>方法/標準</th><th>頻率</th><th>判定/備註</th></tr>
        ${mats.map(m=>{
          const 尾=[m.判定,m.備註].filter(Boolean).join('｜');
          return `<tr><td>${esc(m.項目)}</td><td class="muted">${esc(m.方法)||'—'}</td><td>${esc(m.頻率)||'—'}</td><td class="muted">${esc(尾)||'—'}</td></tr>`;
        }).join('')}
      </table></div></details>` : '';
    const 空 = (!試驗table && !材料block)
      ? `<p class="muted" style="margin:8px 0 0">本章工項卡未列試驗頻率卡與材料頻率表（多為程序性章節）。</p>` : '';
    cards+=`<div class="card">
      <table><tr class="grp"><td colspan="5" class="h ok">✓ <span class="code">${code}</span>${fam} ${esc(wi.title)} <span class="muted">　合計 ${qty||'—'} ${esc(unit)}</span></td></tr></table>
      ${試驗table?`<div class="scroll">${試驗table}</div>`:''}${材料block}${空}</div>`;
  }
  const summary=`<div class="card"><div class="stat">
    <div class="box"><small>標單章碼</small><b>${grouped(items).length}</b></div>
    <div class="box"><small>對到工項</small><b class="ok">${命中}</b></div>
    <div class="box"><small>未建工項</small><b class="${未建?'miss':''}">${未建}</b></div>
    <div class="box"><small>疑似漏編</small><b class="${漏編?'warn':''}">${漏編}</b></div>
    <div class="box"><small>材料頻率</small><b>${材料章}</b></div>
    <div class="box"><small>編列試驗</small><b>${tests.length}</b></div></div></div>`;
  const 未建card=未建list.length?`<div class="card"><details><summary class="miss" style="font-weight:600">⚠ 未建工項卡的章碼 ${未建list.length} 個（覆蓋缺口）</summary><div class="scroll" style="margin-top:8px"><table><tr><th>章碼</th><th>項數</th><th>例</th></tr>${未建list.join('')}</table></div></details></div>`:'';
  document.getElementById('out').innerHTML=summary+cards+未建card;
  document.getElementById('dl').style.display='none';
}

// ===== 作業要點 §8 金額級距：決定監造計畫要含哪幾章 =====
// 逐字依據 03_品質管理作業要點_原文 §八（150萬以上須提報監造計畫，內容依金額分三級）：
//   5000萬以上   ：監造範圍、監造組織、品質計畫審查、施工計畫審查、材料與設備抽驗、施工抽查、品質稽核、文件紀錄管理系統

//   150萬~1000萬 ：監造組織、品質計畫審查、施工計畫審查、材料與設備抽驗、施工抽查【免文件紀錄管理系統與品質稽核】
//                  （原文未列「監造範圍」，故第一章亦免列）
//   第六章 設備功能運轉測試：【含運轉類機電設備者增訂】——獨立開關，不由金額決定
// 🔴 未實作前產生器一律吐九章，使 5000 萬以下案件被多寫第八章、150萬~1000萬 多寫三章。
//    KB 第八章樣板明文：「不得為求章節齊全而硬寫——多寫等於自行加重監造義務」。
const CH_NAME={1:'監造範圍',2:'監造組織及權責分工',3:'品質計畫審查程序',4:'施工計畫審查程序',
  5:'材料與設備抽驗程序及標準',6:'設備功能運轉測試程序及標準',7:'施工抽查程序及標準',
  8:'品質稽核',9:'文件紀錄管理系統'};
function tierOf(amt,mech){
  const base=n=>{ const s=new Set(n); if(mech) s.add(6); return s; };
  if(amt==null) return {key:'未判定',label:'未填契約金額',
    chs:base([1,2,3,4,5,7,8,9]), warn:'⚠ 未填契約金額，暫以完整九章產出。依作業要點 §8，5,000 萬以下應免列部分章節——定稿前務必填入金額重新產生。'};
  if(amt<150) return {key:'<150萬',label:'未達 150 萬',chs:base([]),
    warn:'⛔ 契約金額未達 150 萬，依作業要點 §8 <b>不須提報監造計畫</b>。'};
  if(amt<1000) return {key:'150萬~1000萬',label:'150 萬 ~ 1,000 萬',chs:base([2,3,4,5,7]),
    warn:'依作業要點 §8，本級距<b>免列第一章監造範圍、第八章品質稽核、第九章文件紀錄管理系統</b>。'};
  if(amt<5000) return {key:'1000萬~5000萬',label:'1,000 萬 ~ 5,000 萬',chs:base([1,2,3,4,5,7,9]),
    warn:'依作業要點 §8，本級距<b>免列第八章品質稽核</b>。'};
  return {key:'≥5000萬',label:'5,000 萬以上',chs:base([1,2,3,4,5,7,8,9]),
    warn:'依作業要點 §8，本級距須撰寫全部章節。'};
}

// 這裡把卡片 markdown 直接渲染，KB 一改、重新編譯即生效。
const TPLCH = D.章樣板 || {};

// --- 條件塊求值。回傳 true／false／null(無法判定) ---
// 🔴 無法判定時**不得**擅自納入或排除——一律保留並標示，由使用者裁決。
//    靜默納入 = 多寫（自行加重義務）；靜默排除 = 漏寫。兩種都比「標出來」糟。
function condCtx(){

function inRange(v,lo,hi){ return v==null?null:(v>=lo && (hi==null||v<hi)); }
function evalCond(text,c){
  const t=String(text||'').trim();
  if(!t||t==='…') return null;
  if(/^契約金額\s*<\s*5000萬$/.test(t))  return c.amt==null?null:c.amt<5000;
  if(/^契約金額\s*≤\s*1000萬$/.test(t))  return c.amt==null?null:c.amt<=1000;
  if(/^廠商契約金額\s*≥\s*5000萬$/.test(t))      return inRange(c.vendorAmt,5000,null);
  if(/^廠商契約金額\s*1000萬~5000萬$/.test(t))   return inRange(c.vendorAmt,1000,5000);
  if(/^廠商契約金額\s*150萬~1000萬$/.test(t))    return inRange(c.vendorAmt,150,1000);
  if(/^本案有委託專案管理廠商$/.test(t)) return c.pmSet? c.pm : null;
  if(/^本案無委託專案管理廠商$/.test(t)) return c.pmSet? !c.pm : null;
  const own=(m)=>{ if(c.owner) return c.owner.includes(m); return null; };
  if(/^主辦機關為台灣電力公司$/.test(t))     return c.src? (c.src==='台電')   : own('台灣電力');
  if(/^主辦機關為桃園市政府工務局$/.test(t)) return c.src? (c.src==='桃園')   : own('桃園');
  if(/^主辦機關為公路局$/.test(t))           return c.src? (c.src==='公路局') : own('公路局');
  const BR=['範本_橋梁基礎與下部結構','範本_橋梁上部結構','範本_鋼橋工程','範本_橋梁附屬設施'];
  if(/^橋梁工程$/.test(t)) return c.tpls.length? c.tpls.some(x=>BR.includes(x)) : null;
  if(/^建築工程$/.test(t)) return c.tpls.length? false : null;
  return null;
}

// --- 生成塊對映：卡片宣告的生成塊 → 已實作之產生內容 ---
function genBlock(spec,G){
  const t=String(spec||'');
  if(/主要施工項目表/.test(t))                 return G.ch1;
  if(/材料品質標準表/.test(t))                 return G.ch5;
  if(/施工抽查標準|各工項抽查標準/.test(t))     return G.ch7;
  if(/檢驗停留點清單/.test(t))                 return G.holds;
  if(/分項施工計畫清單/.test(t))               return G.ch3;
  return `<p class="genmiss">〔生成塊尚未實作：${esc(t.split('|')[0].trim()||'未命名')}〕<span class="muted">須人工填列</span></p>`;
}

// --- 極簡 markdown 渲染（只支援卡片實際用到的語法子集）---
function mdInline(x){
  return esc(x)
    .replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g,'$1')      // [[卡|別名]] → 別名（.doc 不需連結）
    .replace(/\[\[([^\]]*)\]\]/g,'$1')
    .replace(/\{\{參數:([^}|]*)(?:\|[^}]*)?\}\}/g,(m,f)=>{
      const nm=f.trim(), v=paramValue(nm);
      return v ? `<span class="pfilled">${esc(v)}</span>` : `<span class="ph">［${esc(nm)}］</span>`;
    })
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<span class="code">$1</span>');
}
function renderMD(md,ctx,G){
  // 1) 先處理條件塊（跨行），再逐行渲染
  md=String(md||'').replace(/\{\{條件:([^}]*)\}\}([\s\S]*?)\{\{\/條件\}\}/g,(m,c,inner)=>{
    const v=evalCond(c,ctx);
    if(v===true)  return inner;
    if(v===false) return '';
    return `\n<!--COND-->〔條件未判定：${c.trim()||'（空）'}〕\n`+inner+'\n<!--/COND-->\n';
  });
  const L=md.split('\n'); let out='',tb=null,list=null;
  const closeList=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  const closeTable=()=>{ if(tb){ out+='</table>'; tb=null; } };
  for(let raw of L){
    const ln=raw.replace(/\s+$/,'');
    const g=ln.match(/^\{\{生成:([^}]*)\}\}\s*$/);
    if(g){ closeList();closeTable(); out+=genBlock(g[1],G); continue; }
    if(/^<!--COND-->/.test(ln)){ closeList();closeTable();
      out+=`<div class="condbox"><span class="tag n">條件未判定</span> <span class="muted">${esc(ln.replace('<!--COND-->',''))}——請自行確認是否適用後保留或刪除</span>`; continue; }
    if(/^<!--\/COND-->/.test(ln)){ closeList();closeTable(); out+='</div>'; continue; }
    if(/^\s*$/.test(ln)){ closeList();closeTable(); continue; }
    if(/^---+\s*$/.test(ln)){ closeList();closeTable(); out+='<hr>'; continue; }
    if(/^\|/.test(ln)){
      const cells=ln.replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;       // 分隔列
      closeList();
      if(!tb){ tb='t'; out+='<table><tr>'+cells.map(c=>`<th>${mdInline(c)}</th>`).join('')+'</tr>'; }
      else   { out+='<tr>'+cells.map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>'; }
      continue;
    }
    closeTable();
    let m;
    if(m=ln.match(/^###\s+(.*)$/)){ closeList(); out+=`<h4>${mdInline(m[1])}</h4>`; continue; }
    if(m=ln.match(/^##\s+(.*)$/)){ closeList();
      // 標題末尾的〔常數塊＋參數〕〔生成塊〕等是撰寫器標註，非章節名稱；
      // 開頭的 🔴⚠📌 等是 KB 內部強調記號——兩者都不該出現在送審文件的節標題
      out+=`<h3>${mdInline(m[1].replace(/〔[^〕]*〕\s*$/,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F]/gu,'').replace(/\s{2,}/g,' ').trim())}</h3>`; continue; }
    if(m=ln.match(/^>\s?(.*)$/)){ closeList(); out+=`<p class="tplnote">${mdInline(m[1])}</p>`; continue; }
    if(m=ln.match(/^\s*\d+\.\s+(.*)$/)){ if(list!=='ol'){closeList();out+='<ol>';list='ol';} out+=`<li>${mdInline(m[1])}</li>`; continue; }
    if(m=ln.match(/^\s*[-*]\s+(.*)$/)){ if(list!=='ul'){closeList();out+='<ul>';list='ul';} out+=`<li>${mdInline(m[1])}</li>`; continue; }
    closeList(); out+=`<p>${mdInline(ln)}</p>`;
  }
  closeList(); closeTable();
  return out;
}
// 章內容：優先取 KB 章樣板卡；無卡者（第六章）回退硬編 BOILER
function chapterBody(n,ctx,G,fallback){
  const c=TPLCH[String(n)];
  return c ? renderMD(c.md,ctx,G) : fallback;
}

// ================= 參數填寫（{{參數:}} → 實際值） =================
// 74 個不重複參數／96 次出現。填一次即套用同名全部出現處。
// 🔴 保存年限在第九章「品質紀錄總表」出現 12 次（12 種不同紀錄各一列）——
//    KB 以同一參數名建模，故填一次會全部套同值。多數案件品質紀錄年限一致故可接受，
//    但各類紀錄年限不同時必須於下載後個別修改；介面已就重複次數提示。
const PKEY='spec_web_params_v1';
let PARAMS={};
try{ PARAMS=JSON.parse(localStorage.getItem(PKEY)||'{}'); }catch(e){ PARAMS={}; }
function savePARAMS(){ try{ localStorage.setItem(PKEY,JSON.stringify(PARAMS)); }catch(e){} }
// 已在「案件資料」填過的，不重複要求
const PMAP={'工程名稱':'pName','主辦機關':'pOwner','監造單位':'pSup'};
function paramValue(name){
  const id=PMAP[name];
  if(id){ const v=(document.getElementById(id)||{}).value||''; if(v) return v; }
  if(name==='契約金額'){ const P=profile(); if(P.amt!=null) return P.amt.toLocaleString()+' 萬元'; }
  return (PARAMS[name]||'').trim();
}
// 掃出「本次應撰寫章節」實際需要的參數（免列章不必填）
function paramsNeeded(tier){
  const out=[];
  for(const n of [1,2,3,4,5,6,7,8,9]){
    const c=TPLCH[String(n)]; if(!c||!tier.chs.has(n)) continue;
    let sec=''; const seen={};
    for(const line of c.md.split('\n')){
      const h=line.match(/^##\s+(.*)$/);
      if(h) sec=h[1].replace(/〔[^〕]*〕\s*$/,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}️]/gu,'').trim();
      for(const m of line.matchAll(/\{\{參數:([^}|]*)(?:\|[^}]*)?\}\}/g)){
        const nm=m[1].trim();
        if(seen[nm]){ seen[nm].n++; continue; }
        seen[nm]={ch:n,sec,name:nm,n:1}; out.push(seen[nm]);
      }
    }
  }
  return out;
}
const ROLES=['計畫主持人','主任監造技師','專業監造人員','品管人員','現場監工','測量人員'];
function renderParams(){
  const el=document.getElementById('params'); if(!el) return;
  if(MODE!=='plan'||!LAST){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='';
  const tier=tierOf(profile().amt,profile().mech);
  const need=paramsNeeded(tier);
  const filled=need.filter(p=>paramValue(p.name)).length;

    <summary><b>✍ 待填參數</b> <span class="muted">已填 ${filled} / ${need.length}（僅列出本案應撰寫章節所需；填一次即套用同名全部出現處）</span></summary>
    <p class="muted" style="margin:8px 0">已在上方「案件資料」填過的欄位會自動帶入，此處不重複要求。輸入即時反映到下方計畫。</p>
    <datalist id="roleList">${ROLES.map(r=>`<option value="${r}">`).join('')}</datalist>`;
  for(const ch of Object.keys(byCh).sort((a,b)=>a-b)){
    h+=`<h4 style="margin:14px 0 6px">第${'〇一二三四五六七八九'[ch]}章　${esc(CH_NAME[ch])}</h4>
      <table><tr><th style="width:200px">參數</th><th style="width:220px">值</th><th>出現節次</th></tr>`;
    for(const p of byCh[ch]){
      const auto=PMAP[p.name]||p.name==='契約金額';
      const v=paramValue(p.name);
      const dl=/^職稱\d+$/.test(p.name)||/職稱$/.test(p.name)?' list="roleList"':'';
      h+=`<tr><td>${esc(p.name)}${p.n>1?` <span class="tag n">×${p.n}</span>`:''}</td>
        <td>${auto
          ? `<span class="muted">${v?esc(v):'（請於上方案件資料填寫）'}</span>`
          : `<input class="pinput" data-p="${esc(p.name)}" value="${esc(PARAMS[p.name]||'')}"${dl} style="width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)">`}</td>
        <td class="muted">${esc(p.sec)}${p.n>1?`（本章 ${p.n} 處，填一次全部套用${p.name==='保存年限'?'；各類紀錄年限不同時請於下載後個別修改':''}）`:''}</td></tr>`;
    }
    h+='</table>';
  }
  h+=`<div class="row" style="margin-top:12px"><button id="pClear">✕ 清除所有參數</button>
      <span class="muted">參數存於本機瀏覽器，換案件請先清除</span></div></details></div>`;
  el.innerHTML=h;
  el.querySelectorAll('.pinput').forEach(inp=>{
    inp.addEventListener('input',()=>{
      PARAMS[inp.dataset.p]=inp.value; savePARAMS();
      document.getElementById('out').innerHTML=`<div class="card">${planHTML()}</div>`;   // 只重繪計畫，保留輸入焦點
      const sm=el.querySelector('summary .muted');
      if(sm){ const nd=paramsNeeded(tier); sm.textContent=`已填 ${nd.filter(x=>paramValue(x.name)).length} / ${nd.length}（僅列出本案應撰寫章節所需；填一次即套用同名全部出現處）`; }
    });
  });
  const cl=el.querySelector('#pClear');
  if(cl) cl.onclick=()=>{ PARAMS={}; savePARAMS(); renderParams(); renderPlan(); };
}

function planHTML(){

    ${chapterHTML(4,tier,B(4))}
    ${chapterHTML(5,tier,B(5))}
    ${chapterHTML(6,tier,OL(BOILER.s6))}
    ${chapterHTML(7,tier,B(7))}
    ${chapterHTML(8,tier,B(8))}
    ${chapterHTML(9,tier,B(9))}
  </div>`;
}
function renderPlan(){
  renderParams();
  document.getElementById('out').innerHTML=`<div class="card">${planHTML()}</div>`;
  document.getElementById('dl').style.display='';
}
function downloadDoc(){
  const html=planHTML().replace(/class="[^"]*"/g,'');
  const doc=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'>
    <style>body{font-family:'標楷體',serif;font-size:12pt;line-height:1.6}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px 6px;font-size:10.5pt}h2{font-size:15pt;border-bottom:1.5pt solid #000;padding-bottom:2pt}h3{font-size:13pt}h4{font-size:12pt}ol,ul{margin:4pt 0 4pt 22pt}</style></head>
    <body>${html}</body></html>`;
  const blob=new Blob(['﻿'+doc],{type:'application/msword'});
  const nm=(profile().name||'監造計畫')+'_九章草稿.doc';
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nm; a.click();
}


// ================= 分項工程範本勾選（無標單模式） =================
// 設計：勾選結果組成與 parseWB 相同形狀的 LAST（items:[{章碼,項目,單位,數量}]），
// 因此第五章/第七章/下載 .doc 全部沿用既有程式碼，不必為「無標單」另寫一套產生器。
// 無數量時 calcN 回 n:null 並附註，組數欄顯示「需數量」——規則照印，只少那個數字。
const TPL = D.分項工程範本 || {};
let PICK = { src:null, tpls:new Set(), off:new Set(), on:new Set() };

function tplList(){ return Object.entries(TPL).sort((a,b)=>String(a[1].代號).localeCompare(String(b[1].代號))); }
function srcTable(){ return (D.工項_源||{})[PICK.src] || {}; }
function tplAvail(v){ const t=srcTable(); return v.章碼.filter(r=>t[r.章碼]).length; }

// 目前選定之章碼＝各已勾範本的核心章（扣掉手動取消）＋手動加選
function pickedCodes(){
  const t=srcTable(), out=new Set();
  for(const id of PICK.tpls){ const v=TPL[id]; if(!v) continue;
    for(const r of v.章碼){ if(r.分類==='核心' && t[r.章碼] && !PICK.off.has(r.章碼)) out.add(r.章碼); } }
  for(const c of PICK.on) if(t[c]) out.add(c);
  return out;
}

function renderPicker(){
  const el=document.getElementById('picker');
  const SRCS=['桃園','公路局','台電'];
  let h='<div class="card"><h3 style="margin:0 0 4px">🧩 選工項（無標單也能產出監造計畫）</h3>'
   +'<p class="muted" style="margin:0 0 12px">監造計畫 95% 的內容與標單數量無關——停留點、查核紅線、材料試驗規則都不需要數量。'
   +'只有「本案要做幾組」需要，未填數量時該欄顯示「需數量」，其餘照常產出。</p>';

  // Step 1 規範源（閘門）
  h+='<h4 style="margin:14px 0 6px">① 選規範源<span class="muted" style="font-weight:400"> — 必選，且只能選一個</span></h4>'
   +'<p class="muted" style="margin:0 0 8px">🔴 三源同章碼數值<b>嚴禁互借</b>，且分歧方向逐章不同（02742 公路局較寬、03210/03231 公路局較嚴）。故此處是閘門不是篩選器。</p><div class="row">';
  for(const sname of SRCS){ const n=Object.keys((D.工項_源||{})[sname]||{}).length;
    h+=`<button class="pk-src ${PICK.src===sname?'on':''}" data-src="${sname}">${sname}<span class="muted"> ${n} 章</span></button>`; }
  h+='</div>';

  if(!PICK.src){ h+='<p class="muted" style="margin-top:14px">↑ 先選規範源，才會列出可用的分項工程。</p></div>'; el.innerHTML=h; bindPicker(); return; }

  // Step 2 範本
  // 🔴 空清單必須大聲失敗。先前只畫表頭不畫列，看起來像「這個源沒有範本」，
  //    實際是 spec_data.js 舊版沒有「分項工程範本」鍵（瀏覽器分別快取 index.html 與 spec_data.js）。
  //    畫得出表頭卻沒資料 ＝ 儀表板說謊，是本專案反覆修掉的錯誤型態。
  if(!Object.keys(TPL).length){
    h+='<div class="card miss" style="margin-top:16px"><b>⚠ 載入的 spec_data.js 沒有「分項工程範本」資料</b>'
     +'<p class="muted" style="margin:6px 0 0">目前 spec_data 產生日期：<span class="code">'+esc(D.meta&&D.meta.generated||'未知')+'</span>。'
     +'多半是瀏覽器仍在用舊版 spec_data.js（它與 index.html 各自快取）。'
     +'請<b>強制重新整理</b>（Mac：⌘⇧R／Windows：Ctrl+F5），或於網址列加 <span class="code">?v='+Date.now()+'</span> 後重載。</p></div></div>';
    el.innerHTML=h; bindPicker(); return;
  }
  h+='<h4 style="margin:18px 0 6px">② 勾選分項工程<span class="muted" style="font-weight:400"> — 可複選，之後可再組合</span></h4>'
   +'<table><tr><th style="width:38px"></th><th>分項工程</th><th style="width:96px">本源可用</th><th>前置範本</th></tr>';
  for(const [id,v] of tplList()){
    const avail=tplAvail(v), dis=avail===0, ck=PICK.tpls.has(id);
    const pre=(v.前置範本||[]).map(x=>{ const p2=TPL[x]; return p2?p2.代號:x; }).join('、')||'—';
    const miss=(v.前置範本||[]).filter(x=>!PICK.tpls.has(x));
    h+=`<tr${dis?' class="muted"':''}><td><input type="checkbox" class="pk-tpl" data-id="${id}" ${ck?'checked':''} ${dis?'disabled':''}></td>`
     +`<td><b>${v.代號}</b> ${esc(v.title.replace(/^範本\s*/,''))}${dis?' <span class="tag n">本源無可用章</span>':''}`
     +`${ck&&miss.length?` <span class="tag n">建議一併勾選 ${miss.map(x=>TPL[x]?TPL[x].代號:x).join('、')}</span>`:''}</td>`
     +`<td>${avail} / ${v.章碼.length}</td><td class="muted">${esc(pre)}</td></tr>`;
  }
  h+='</table>';

  // Step 3 章碼清單
  const picked=pickedCodes(), t=srcTable();
  if(PICK.tpls.size){
    h+=`<h4 style="margin:18px 0 6px">③ 逐章確認<span class="muted" style="font-weight:400"> — 核心章預設勾選；選配章請依實際工程內容勾</span></h4>`
     +`<p class="muted" style="margin:0 0 8px">⚠ 選配章勿全勾。例如基樁四種工法全勾，會把不相干的停留點寫進監造計畫。</p>`;
    for(const id of [...PICK.tpls].sort((a,b)=>String(TPL[a].代號).localeCompare(String(TPL[b].代號)))){
      const v=TPL[id]; if(!v) continue;
      h+=`<details open style="margin:8px 0"><summary><b>${v.代號}</b> ${esc(v.title.replace(/^範本\s*/,''))}</summary><table style="margin-top:6px">`
       +'<tr><th style="width:38px"></th><th style="width:88px">章碼</th><th style="width:64px">分類</th><th>章名</th><th>說明</th></tr>';
      for(const r of v.章碼){
        const has=!!t[r.章碼];
        const core=r.分類==='核心';
        const on = has && (core ? !PICK.off.has(r.章碼) : PICK.on.has(r.章碼));
        h+=`<tr${has?'':' class="muted"'}>`
         +`<td><input type="checkbox" class="pk-code" data-code="${r.章碼}" data-core="${core?1:0}" ${on?'checked':''} ${has?'':'disabled'}></td>`
         +`<td><span class="code">${r.章碼}</span></td>`
         +`<td>${core?'<span class="tag y">核心</span>':'<span class="tag n">'+esc(r.分類)+'</span>'}</td>`
         +`<td>${esc(r.章名)}${has?'':' <span class="tag n">本源無此章</span>'}</td>`
         +`<td class="muted">${esc(r.說明)}</td></tr>`;
      }
      h+='</table></details>';
    }
  }

  h+=`<div class="row" style="margin-top:16px;align-items:center">`
   +`<button id="pkGo" ${picked.size?'':'disabled'}>✅ 產生工項清單（${picked.size} 章）→ 監造計畫</button>`
   +`<button id="pkClear">✕ 清除選取</button>`
   +`<span class="muted">已選 ${picked.size} 章｜規範源 ${PICK.src}</span></div></div>`;
  el.innerHTML=h; bindPicker();
}

function bindPicker(){
  document.querySelectorAll('.pk-src').forEach(b=>b.onclick=()=>{
    if(PICK.src!==b.dataset.src){ PICK.src=b.dataset.src; PICK.tpls=new Set(); PICK.off=new Set(); PICK.on=new Set(); }
    renderPicker(); });
  document.querySelectorAll('.pk-tpl').forEach(c=>c.onchange=()=>{
    c.checked?PICK.tpls.add(c.dataset.id):PICK.tpls.delete(c.dataset.id); renderPicker(); });
  document.querySelectorAll('.pk-code').forEach(c=>c.onchange=()=>{
    const code=c.dataset.code, core=c.dataset.core==='1';
    if(core){ c.checked?PICK.off.delete(code):PICK.off.add(code); }
    else    { c.checked?PICK.on.add(code):PICK.on.delete(code); }
    renderPicker(); });
  const go=document.getElementById('pkGo'); if(go) go.onclick=applyPicks;
  const cl=document.getElementById('pkClear'); if(cl) cl.onclick=()=>{
    PICK.tpls=new Set(); PICK.off=new Set(); PICK.on=new Set(); renderPicker(); };
}

function applyPicks(){
  const t=srcTable(), items=[];
  for(const code of [...pickedCodes()].sort()){
    const wi=t[code]; if(!wi) continue;
    items.push({章碼:code, 項目:wiName(wi.title), 單位:'', 數量:null});
  }
  SRCSEL=PICK.src;
  LAST={items, tests:[]};
  document.getElementById('src').textContent=`勾選：${PICK.src}｜${[...PICK.tpls].map(x=>TPL[x]?TPL[x].代號:x).sort().join('+')}（工項 ${items.length}）`;
  setMode('plan');
}

function render(){
  const pk=document.getElementById('picker'), out=document.getElementById('out');
  const pr=document.getElementById('params');
  if(MODE==='pick'){ pk.style.display=''; pr.style.display='none'; out.innerHTML=''; renderPicker(); return; }
  pk.style.display='none';
  if(MODE!=='plan'){ pr.style.display='none'; pr.innerHTML=''; }
  if(!LAST){ out.innerHTML='<div class="card muted">尚無工項清單。可<b>上傳標單</b>，或按「🧩 選工項（無標單）」以分項工程範本勾選。</div>'; return; }
  MODE==='plan'?renderPlan():renderCheck();
}
function setMode(m){ MODE=m;
  for(const [id,mm] of [['mCheck','check'],['mPick','pick'],['mPlan','plan']])
    document.getElementById(id).className=(m===mm?'on':'');
  document.getElementById('dl').style.display=(m==='plan'&&LAST)?'':'none';
  render(); }

function loadWB(wb,label){ SRCSEL=null; LAST=parseWB(wb); document.getElementById('src').textContent=label+`（工項 ${LAST.items.length}）`; render(); }
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=ev=>loadWB(XLSX.read(ev.target.result,{type:'array'}),'上傳：'+f.name);rd.readAsArrayBuffer(f);};
document.getElementById('sampleBtn').onclick=()=>fetch('sample.xls').then(r=>r.arrayBuffer())
  .then(b=>loadWB(XLSX.read(b,{type:'array'}),'範例：航空城復原工程開口契約'))
  .catch(()=>document.getElementById('out').innerHTML='<div class="card miss">範例載入失敗（需 http 伺服器）。請改用上傳。</div>');
const pm=document.getElementById('pPM'); if(pm) pm.addEventListener('change',()=>{pm.dataset.touched='1';});
for(const id of ['pAmt','pMech','pVendorAmt','pPM','pOwner']){
  const el=document.getElementById(id);
  if(el) el.addEventListener('input',()=>{ updateTierNote(); if(MODE==='plan'&&LAST) renderPlan(); });
}
updateTierNote();
document.getElementById('mCheck').onclick=()=>setMode('check');
document.getElementById('mPick').onclick=()=>setMode('pick');
document.getElementById('mPlan').onclick=()=>setMode('plan');
document.getElementById('dl').onclick=downloadDoc;
</script>
